name: Collect Clarent verification log

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download failed browser verification log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hrazzell/sunder-website/actions/jobs/88567542219/logs \
            --output output/verification-job.log

      - name: Upload verification log
        uses: actions/upload-artifact@v4
        with:
          name: clarent-verification-log
          path: output/verification-job.log
          if-no-files-found: error
          retention-days: 1
